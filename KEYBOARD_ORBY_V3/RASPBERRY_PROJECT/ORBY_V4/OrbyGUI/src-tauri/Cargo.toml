[package]
name = "orby-app"
version = "1.0.0-alpha"
edition = "2021"
description = "La cáscara de escritorio de OrbyGUI: ventana, puerto serie y todo lo que solo puede hacer el PC."

# El espacio de trabajo se declara aquí y no en el crate de dentro: orby-core es una
# biblioteca pura que también se compila sola en Linux, y quien manda sobre el lock y el
# directorio target es la app.
[workspace]
members = ["crates/orby-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orby-core = { path = "crates/orby-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# Con el autoarranque puesto, la app ya está corriendo escondida al iniciar sesión: un doble
# clic en el acceso directo abriría un segundo proceso que pelearía por el puerto COM con el
# primero (en Windows solo lo puede tener abierto uno). El plugin redirige ese segundo
# arranque a la ventana de la instancia que ya vive.
tauri-plugin-single-instance = "2"
# El actualizador de verdad: descarga el instalador, comprueba su firma minisign contra la
# clave pública de tauri.conf.json y lo lanza. `tauri-plugin-process` es quien sabe
# reiniciar la app después de instalarla.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
# Solo para la marca de tiempo del nombre que propone el diálogo de copia de seguridad.
# Ya venía en el árbol de Tauri, así que no añade descarga.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Para consultar las releases de GitHub y descargar el .uf2 del firmware (Tarea 9). El
# propio Tauri ya trae reqwest en el árbol, pero sin backend TLS: aquí hace falta hablar
# HTTPS de verdad. `rustls` y no `native-tls`, porque es TLS puro en Rust sin ningún
# componente en C que enlazar, y el toolchain de este proyecto es GNU sin las Build Tools
# de MSVC.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# Descomprimir un complemento (Tarea 10). Solo `deflate`, que en `zip` tira de `flate2`
# con su backend en Rust puro (`miniz_oxide`): los otros métodos de compresión (bzip2,
# lzma, zstd) enlazan una librería en C, y aquí no hace falta ninguno de ellos.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Win32 directo. Sustituye a nut-js (posición del ratón) y al PowerShell permanente que
# hoy resuelve los accesos directos: son cuatro llamadas y desaparece el proceso hijo.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  # La clave `Run` del autoarranque.
  "Win32_System_Registry",
  # `GetCurrentThreadId`, que es a quien se le manda el WM_QUIT que para los ganchos de
  # la grabadora.
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
