[package]
name = "orby-core"
version = "0.1.0"
edition = "2021"
description = "Lógica de OrbyGUI que no depende de la plataforma: protocolo serie, configuración local y complementos."

# Crate propio, sin Tauri y sin nada de Windows, a propósito: es lo que permite
# comprobar con `cargo test` en cualquier máquina la lógica que da miedo perder al
# migrar. La cáscara que toca Win32 vive aparte y solo compila en Windows.
#
# Miembro del espacio de trabajo de ../../Cargo.toml: por eso aquí ya no hay `[workspace]`
# propio. Se prueba con `cargo test -p orby-core` desde src-tauri/.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hash de los vídeos de consejos. Puro Rust, ya estaba en el árbol por Tauri.
sha2 = { version = "0.10", default-features = false }
